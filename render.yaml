# Render Free para demostración académica.
# La base Free vence a los 30 días; no usar para datos operativos reales.
services:
  - type: web
    name: eventos-nova-pia
    runtime: docker
    plan: free
    region: oregon
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: eventos-nova-db
          property: connectionString
      - key: TOKENS_JSON
        sync: false
      - key: SEED_DATA
        value: "true"
databases:
  - name: eventos-nova-db
    plan: free
    region: oregon
    postgresMajorVersion: "18"
    ipAllowList: []
    databaseName: nova
    user: nova
