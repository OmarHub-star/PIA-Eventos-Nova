services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nova}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ejecuta python scripts/init_env.py}
      POSTGRES_DB: ${POSTGRES_DB:-nova}
    volumes:
      - nova_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nova}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nova}
      TOKENS_JSON: ${TOKENS_JSON:?Ejecuta python scripts/init_env.py}
      SEED_DATA: ${SEED_DATA:-true}
      PORT: 8000
    ports:
      - "${PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20
  tests:
    build: .
    profiles: ["quality"]
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nova}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nova}
      API_BASE_URL: http://app:8000
    command: ["python", "-m", "pytest", "-q", "--cov=src", "--cov-fail-under=80"]
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy
volumes:
  nova_db:
